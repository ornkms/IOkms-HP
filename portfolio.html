<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>記憶 | Portfolio</title>

<style>
:root{
  --bg:#0b1020;
  --card:#121a33;
  --text:#ffffff;
  --muted:#a8b0c2;
  --accent:#7c5cff;
  --accent2:#4aa3ff;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* =========================
   HEADER
========================= */

header{
  padding:60px 20px;
  text-align:center;
  background:radial-gradient(circle at top,#1a2450,#0b1020);
}

.logo{
  margin:0;
}

.logo img{
  width:180px;
  height:auto;
  display:block;
  margin:0 auto;
}

header p{
  margin-top:10px;
  color:var(--muted);
}

.status{
  margin-top:15px;
}

.badge{
  color:#7dffb2;
  font-weight:bold;
}

/* =========================
   NAV
========================= */

nav{
  margin-top:30px;
}

nav a{
  color:var(--muted);
  text-decoration:none;
  margin:0 12px;
  transition:.2s;
}

nav a:hover{
  color:var(--text);
}

/* =========================
   SECTION
========================= */

section{
  max-width:1100px;
  margin:auto;
  padding:80px 20px;
}

h2{
  font-size:28px;
  border-left:4px solid var(--accent);
  padding-left:12px;
  margin-bottom:40px;
}

.category-title{
  font-size:22px;
  color:var(--accent2);
  margin:50px 0 20px;
}

/* =========================
   GRID
========================= */

.works-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}

/* =========================
   CARD
========================= */

.work-card{
  background:var(--card);
  border-radius:12px;
  padding:12px;
  overflow:hidden;
  transition:.3s;
}

.work-card:hover{
  transform:translateY(-5px);
}

.work-card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:10px;
  display:block;
  margin-bottom:10px;
}

.work-card h3{
  margin:5px 0;
  color:var(--accent);
}

.work-card p{
  margin:5px 0;
  color:var(--muted);
  font-size:14px;
}

.work-card a{
  display:inline-block;
  margin-top:10px;
  color:var(--accent2);
  text-decoration:none;
}

.work-card a:hover{
  text-decoration:underline;
}

/* =========================
   PROCESS
========================= */

.process-grid{
  display:grid;
  gap:20px;
}

.process-card{
  background:var(--card);
  padding:24px;
  border-radius:16px;
  border-left:4px solid var(--accent);
}

.process-card h3{
  margin:10px 0;
  color:var(--text);
}

.process-card p{
  color:var(--muted);
  line-height:1.8;
  margin:0;
}

.step{
  color:var(--accent2);
  font-size:13px;
  font-weight:bold;
  letter-spacing:1px;
}
.download-btn{
  display:inline-block;
  margin-top:20px;
  padding:12px 20px;
  background:var(--accent);
  color:#fff;
  text-decoration:none;
  border-radius:10px;
  transition:.2s;
}

.download-btn:hover{
  opacity:.9;
  transform:translateY(-2px);
}
/* =========================
   FOOTER
========================= */

footer{
  text-align:center;
  padding:40px 20px;
  color:var(--muted);
  font-size:14px;
}

/* =========================
   FADE IN
========================= */

.fade-in{
  opacity:0;
  transform:translateY(30px);
  transition:1s ease;
}

.fade-in.show{
  opacity:1;
  transform:translateY(0);
}
</style>
</head>

<body>

<header>

<h1 class="logo">
  <img src="logo.png" alt="記憶">
</h1>

  <p>Web Designer / Creator</p>

  <p class="status">
    依頼受付：<span class="badge">受付中</span>
  </p>

  <nav>
    <a href="index.html">Home</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="process.html">Process</a>
    <a href="price.html">Price</a>
    <a href="faq.html">FAQ</a>
    <a href="terms.html">Terms</a>
    <a href="contact.html">Contact</a>
  </nav>

</header>

<section id="portfolio" class="fade-in">

  <h2>Portfolio</h2>

  <div class="works-grid">

    <div class="work-card">

      <img src="works1.png" alt="倫理 Official Site">

      <div class="work-info">

        <h3>サンプル1</h3>

        <p>歌い手</p>

        <p>制作物：Official Site（LP）</p>

        <a href="https://ornkms.vercel.app/" target="_blank">
          Site View →
        </a>

      </div>

    </div>

    <div class="work-card">

      <img src="works2.png" alt="Sample Site">

      <div class="work-info">

        <h3>サンプル2</h3>

        <p>歌い手</p>

        <p>制作物：Official Site（LP）</p>

        <a href="https://harukawa.vercel.app/" target="_blank">
          Site View →
        </a>

      </div>

    </div>

    <div class="work-card">

      <img src="works3.png" alt="Sample Site">

      <div class="work-info">

        <h3>サンプル3</h3>

        <p>クリエイター</p>

        <p>制作物：Official Site（HP）</p>

 <a href="https://iokms-hp.vercel.app/" target="_blank">
          Site View →
        </a>

      </div>

    </div>

  </div>

</section>

</section>


<footer>
  © 2026 倫理
</footer>


<script>

const targets = document.querySelectorAll('.fade-in');

const observer = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add('show');
    }
  });
});

targets.forEach(target=>{
  observer.observe(target);
});

</script>


</body>
</body>
</html>
